  <rect x="200" y="140" width="400" height="2" fill="url(#accent)" opacity="0.5"/>

  <text x="400" y="165" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="13" fill="#5a6a8a" letter-spacing="1">Lazy.nvim • Mason • LSP • Treesitter</text>

  <text x="400" y="188" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="11" fill="#3a4a6a" letter-spacing="1">MIT License</text>
